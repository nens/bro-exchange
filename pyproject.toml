[project]
name = "bro-exchange"
version = "1.0.4"
description = "This package contains tools for retrieving data from or sending data to the Dutch National Key Registry of the Subsurface (Basis Registratie Ondergrond)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=6.1.1",
    "pandas>=2.0.0",
    "pytz",
    "requests>=2.34.2",
]
license = "MIT"
license-files = ["LICENSE.MD"]
authors = [
    {name = "Karl Schutt", email = "karlschutt@outlook.com"},
    {name = "Steven Hosper", email = "steven.hosper@nelen-schuurmans.nl"},
]
maintainers = [
    {name = "Steven Hosper", email = "steven.hosper@nelen-schuurmans.nl"},
    {name = "Jelle Zitman", email = "jelle.zitman@nelen-schuurmans.nl"},
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# See https://docs.astral.sh/ruff/configuration/ for defaults.
target-version = "py310"

[tool.ruff.lint]
# Default select: ["E4", "E7", "E9", "F"]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bro_exchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["bro_exchange"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
